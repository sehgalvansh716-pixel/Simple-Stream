name: Build & Verify

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SimpleStream APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Stable Release & Debug APKs
        run: ./gradlew assembleStableRelease assembleStableDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleStream-Release-APK
          path: app/build/outputs/apk/stable/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleStream-Debug-APK
          path: app/build/outputs/apk/stable/debug/*.apk
